```yaml
name: "Build & Release Drop&Resize"

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "LICENSE"
      - "LICENSE.txt"

jobs:
  build:
    runs-on: windows-2022

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from AssemblyInfo
        id: get_version
        shell: pwsh
        run: |
          $version = $null

          $assemblyInfo = Get-ChildItem -Path . -Filter AssemblyInfo.cs -Recurse |
            Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' } |
            Select-Object -First 1

          if ($assemblyInfo) {
            $content = Get-Content -Path $assemblyInfo.FullName -Raw

            $fileVersionMatch = [regex]::Match($content, 'AssemblyFileVersion\("([^"]+)"\)')
            $assemblyVersionMatch = [regex]::Match($content, 'AssemblyVersion\("([^"]+)"\)')

            if ($fileVersionMatch.Success) {
              $version = $fileVersionMatch.Groups[1].Value
            }
            elseif ($assemblyVersionMatch.Success) {
              $version = $assemblyVersionMatch.Groups[1].Value
            }
          }

          if (-not $version) {
            $version = "0.1.0"
          }

          $version = $version.Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Project version: $version"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x86

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          nuget restore "Drop&Resize.sln"

      - name: Build solution
        shell: pwsh
        run: |
          msbuild "Drop&Resize.sln" /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare release files
        shell: pwsh
        run: |
          $source = "bin\Release"
          $dest = "output\DropResize"

          if (Test-Path $dest) {
            Remove-Item $dest -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          robocopy $source $dest /E /XF *.pdb | Out-Host

          if ($LASTEXITCODE -le 7) {
            exit 0
          }

          exit $LASTEXITCODE

      - name: Create ZIP package
        shell: pwsh
        run: |
          if (Test-Path "DropResize-Windows.zip") {
            Remove-Item "DropResize-Windows.zip" -Force
          }

          Compress-Archive -Path "output\DropResize" -DestinationPath "DropResize-Windows.zip" -Force

      - name: Upload artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: DropResize-Windows
          path: DropResize-Windows.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: DropResize-Windows

      - name: Create tag if it does not exist
        run: |
          TAG="v${{ needs.build.outputs.version }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "Tag already exists: $TAG"
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "Drop&Resize v${{ needs.build.outputs.version }}"
          body: "Automated Drop&Resize release."
          files: DropResize-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
