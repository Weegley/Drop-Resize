name: "Build & Release Drop&Resize"

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "LICENSE"

permissions:
  contents: write

# Finish an in-flight release before starting another release from this branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the exact source being released
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build release binaries and tests
        run: >-
          msbuild "Drop&Resize.sln" /p:Configuration=Release /p:Platform="Any CPU"
          /p:BuildRevision=${{ github.run_number }} /m /nologo

      - name: Run regression tests
        timeout-minutes: 5
        run: .\Tests\RunTests.ps1 -Configuration Release -SkipBuild

      - name: Verify version and create release package
        id: package
        run: |
          $package = .\Build\PackageRelease.ps1 -ExpectedRevision ${{ github.run_number }}
          "version=$($package.Version)" >> $env:GITHUB_OUTPUT
          "archive=$($package.ArchivePath)" >> $env:GITHUB_OUTPUT
          "notes=$($package.NotesPath)" >> $env:GITHUB_OUTPUT

      - name: Upload tested package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: DropResize-Windows
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Reject an existing tag from a different source commit
        if: github.ref == 'refs/heads/master'
        env:
          RELEASE_TAG: v${{ steps.package.outputs.version }}
        run: |
          $tagReferences = @(git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG" "refs/tags/$env:RELEASE_TAG^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not verify release tag." }
          if ($tagReferences.Count -gt 0) {
            $tagCommit = ($tagReferences[-1] -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) { throw "Release tag already points to another commit." }
          }

      - name: Publish the tested commit and package
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: v${{ steps.package.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Drop&Resize v${{ steps.package.outputs.version }}
          files: ${{ steps.package.outputs.archive }}
          body_path: ${{ steps.package.outputs.notes }}
          generate_release_notes: true
          make_latest: legacy
          fail_on_unmatched_files: true